<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndoLearn - Master Indonesian Easily</title>
  <style>
    :root {
      --bg: #fff5f8;
      --card-bg: #ffffff;
      --primary: #f43f5e;
      --primary-hover: #e11d48;
      --primary-light: #ffe4e6;
      --accent: #f59e0b;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #fecdd3;
      --shadow: 0 4px 14px rgba(244, 63, 94, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    /* Header Profile Card */
    .profile-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .profile-info h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .profile-info p {
      color: var(--primary);
      font-weight: 500;
      margin-top: 4px;
      font-size: 0.95rem;
    }

    .name-input-box {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
    }

    .name-input-box input {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .name-input-box input:focus {
      border-color: var(--primary);
    }

    .name-input-box button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .name-input-box button:hover {
      background: var(--primary-hover);
    }

    .btn-reset {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 8px;
      padding: 0;
      display: none;
    }

    .btn-reset:hover {
      color: var(--primary);
    }

    .stats-group {
      display: flex;
      gap: 12px;
    }

    .stat-badge {
      background: #fafafa;
      border: 1px solid #f3f4f6;
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .stat-badge .icon {
      font-size: 1.4rem;
    }

    .stat-badge .text-group {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* Section Header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .audio-tip {
      background: #fdf2f8;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border);
    }

    /* Chapter Main Card */
    .chapter-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .chapter-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }

    .chapter-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .chapter-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 6px;
      line-height: 1.5;
    }

    .btn-quiz {
      background: #fbbf24;
      color: #78350f;
      border: none;
      padding: 10px 20px;
      border-radius: 24px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-quiz:hover {
      background: #f59e0b;
      transform: translateY(-2px);
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 12px;
    }

    .tab-btn {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Grid Vocab */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .vocab-card {
      background: #fff;
      border: 1.5px solid #f3f4f6;
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .vocab-card:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(244, 63, 94, 0.12);
    }

    .vocab-word {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      display: block;
      margin-bottom: 4px;
    }

    .vocab-phonetic {
      font-size: 0.82rem;
      font-style: italic;
      color: var(--text-muted);
    }

    .vocab-meaning {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--primary);
      margin-left: 6px;
    }

    .speaker-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .speaker-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Profile & Gamification Stats -->
    <header class="profile-card">
      <div class="profile-info">
        <h1 id="welcome-title">Welcome! ✨</h1>
        <p>Ready to practice Indonesian today?</p>

        <!-- Form Input Nama (Hanya tampil sebelum daftar) -->
        <div id="name-form" class="name-input-box">
          <input type="text" id="name-input" placeholder="Enter your name..." />
          <button onclick="saveName()">Start Learning</button>
        </div>

        <!-- Tombol Reset / Ganti Murid -->
        <button id="reset-btn" class="btn-reset" onclick="resetStudent()">Switch student / Log out</button>
      </div>

      <div class="stats-group">
        <div class="stat-badge">
          <span class="icon">⚡</span>
          <div class="text-group">
            <span class="stat-label">XP</span>
            <span class="stat-value" id="xp-count">0</span>
          </div>
        </div>
        <div class="stat-badge">
          <span class="icon">⭐</span>
          <div class="text-group">
            <span class="stat-label">STARS</span>
            <span class="stat-value" id="star-count">0</span>
          </div>
        </div>
        <div class="stat-badge">
          <span class="icon">🔥</span>
          <div class="text-group">
            <span class="stat-label">STREAK</span>
            <span class="stat-value" id="streak-count">0 Days</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Section Header -->
    <div class="section-header">
      <div class="section-title">
        <span>📚</span> Curriculum & Lessons
      </div>
      <div class="audio-tip">
        Click 🔊 for natural audio
      </div>
    </div>

    <!-- Chapter Container -->
    <main class="chapter-card">
      <div class="chapter-top">
        <div>
          <h2 class="chapter-title">Chapter 1: Greetings & Introductions 🌸</h2>
          <p class="chapter-desc">Learn how to greet others, introduce yourself, and show courtesy in daily Indonesian.</p>
        </div>
        <button class="btn-quiz" onclick="startQuiz()">⭐ Start Quiz</button>
      </div>

      <!-- Categories Filter Tabs -->
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="filterCategory('all', this)">All Words</button>
        <button class="tab-btn" onclick="filterCategory('greetings', this)">Time & Greetings</button>
        <button class="tab-btn" onclick="filterCategory('intro', this)">Introductions</button>
        <button class="tab-btn" onclick="filterCategory('courtesy', this)">Courtesies</button>
      </div>

      <!-- Vocab Grid -->
      <div class="vocab-grid" id="vocab-container"></div>
    </main>
  </div>

  <script>
    // Database Materi Kosakata
    const vocabulary = [
      { id: 1, word: "Selamat pagi", phonetic: "suh-lah-maht pah-ghee", meaning: "Good morning", category: "greetings" },
      { id: 2, word: "Selamat siang", phonetic: "suh-lah-maht see-ahng", meaning: "Good afternoon", category: "greetings" },
      { id: 3, word: "Selamat sore", phonetic: "suh-lah-maht soh-reh", meaning: "Good late afternoon", category: "greetings" },
      { id: 4, word: "Selamat malam", phonetic: "suh-lah-maht mah-lahm", meaning: "Good evening", category: "greetings" },
      { id: 5, word: "Apa kabar?", phonetic: "ah-pah kah-bahr", meaning: "How are you?", category: "greetings" },
      { id: 6, word: "Kabar baik", phonetic: "kah-bahr bah-eek", meaning: "I'm doing well", category: "greetings" },
      
      { id: 7, word: "Nama saya...", phonetic: "nah-mah sah-yah", meaning: "My name is...", category: "intro" },
      { id: 8, word: "Senang bertemu denganmu", phonetic: "suh-nahng buhr-tuh-moo", meaning: "Nice to meet you", category: "intro" },
      { id: 9, word: "Saya berasal dari...", phonetic: "sah-yah buhr-ah-sahl", meaning: "I come from...", category: "intro" },
      { id: 10, word: "Sampai jumpa!", phonetic: "sahm-pahy joom-pah", meaning: "See you later!", category: "intro" },

      { id: 11, word: "Terima kasih", phonetic: "teh-ree-mah kah-seeh", meaning: "Thank you", category: "courtesy" },
      { id: 12, word: "Sama-sama", phonetic: "sah-mah sah-mah", meaning: "You are welcome", category: "courtesy" },
      { id: 13, word: "Permisi", phonetic: "puhr-mee-see", meaning: "Excuse me", category: "courtesy" },
      { id: 14, word: "Maaf", phonetic: "mah-ahf", meaning: "Sorry / Pardon", category: "courtesy" }
    ];

    let xp = 0;
    const container = document.getElementById("vocab-container");

    // Sistem Status Murid (Guest vs Terdaftar)
    function checkStudent() {
      const savedName = localStorage.getItem("currentStudent");
      const savedXP = localStorage.getItem("studentXP");

      const title = document.getElementById("welcome-title");
      const nameForm = document.getElementById("name-form");
      const resetBtn = document.getElementById("reset-btn");
      const streakText = document.getElementById("streak-count");
      const xpText = document.getElementById("xp-count");

      if (savedName) {
        title.innerText = `Welcome, ${savedName}! ✨`;
        nameForm.style.display = "none";
        resetBtn.style.display = "inline-block";
        streakText.innerText = "1 Day";
        xp = savedXP ? parseInt(savedXP) : 0;
        xpText.innerText = xp;
      } else {
        title.innerText = "Welcome! ✨";
        nameForm.style.display = "flex";
        resetBtn.style.display = "none";
        streakText.innerText = "0 Days";
        xp = 0;
        xpText.innerText = "0";
      }
    }

    function saveName() {
      const input = document.getElementById("name-input");
      const name = input.value.trim();

      if (name !== "") {
        localStorage.setItem("currentStudent", name);
        input.value = "";
        checkStudent();
      }
    }

    function resetStudent() {
      localStorage.removeItem("currentStudent");
      localStorage.removeItem("studentXP");
      checkStudent();
    }

    // Tampilkan Kartu Kata
    function renderVocab(filter = "all") {
      container.innerHTML = "";
      const filtered = filter === "all" ? vocabulary : vocabulary.filter(item => item.category === filter);

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "vocab-card";
        card.innerHTML = `
          <div>
            <span class="vocab-word">${item.word}</span>
            <span class="vocab-phonetic">${item.phonetic}</span>
            <span class="vocab-meaning">• ${item.meaning}</span>
          </div>
          <button class="speaker-btn" title="Listen">🔊</button>
        `;

        card.addEventListener("click", () => playSound(item.word));
        container.appendChild(card);
      });
    }

    // Fitur Suara (Web Speech API) + Tambah XP
    function playSound(text) {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "id-ID";
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);

        xp += 5;
        document.getElementById("xp-count").innerText = xp;
        if (localStorage.getItem("currentStudent")) {
          localStorage.setItem("studentXP", xp);
        }
      }
    }

    // Tab Filter
    function filterCategory(cat, btn) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderVocab(cat);
    }

    function startQuiz() {
      alert("Great job practicing! Quiz mode will unlock after listening to all words!");
    }

    // Inisialisasi awal
    checkStudent();
    renderVocab();
  </script>
</body>
</html>
